name: Build NeoFabric
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release branding
        run: python3 .github/scripts/check-branding.py
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Build Loader, check all APIs and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew build -Pneofabric.minecraftTestVersion=none --stacktrace --max-workers=2
      - name: Compare the standard Loader with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/master' }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/neofabric-base" "$BASE_REF"
          baseline="$RUNNER_TEMP/neofabric-base"
          bash "$baseline/gradlew" -p "$baseline" finalJar -Pneofabric.minecraftTestVersion=none --stacktrace --max-workers=2
          standard=$(find build/libs -maxdepth 1 -name 'neofabric-loader-*.jar' ! -name '*-fat.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          python3 .github/scripts/compare-standard-jars.py "$baseline"/build/libs/neofabric-loader-*.jar "$standard"
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-tests-core
          path: '**/build/test-results/'
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-jar
          path: build/libs/*.jar
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        minecraft: ['1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6', '1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11']
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17 for older Minecraft tests
        if: contains(fromJSON('["1.20.1", "1.20.2", "1.20.3", "1.20.4"]'), matrix.minecraft)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: temurin
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Compile and test selected Minecraft in an independent JVM
        env:
          MINECRAFT: ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          project="minecraft-test-${MINECRAFT}"
          if [ "$MINECRAFT" = '1.20.1' ]; then project='minecraft-test'; fi
          ./gradlew ":minecraft:${project}:check" spotlessCheck "-Pneofabric.minecraftTestVersion=${MINECRAFT}" --stacktrace --max-workers=2
      - name: Upload version test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-tests-${{ matrix.minecraft }}
          path: '**/build/test-results/'
          if-no-files-found: ignore

  build-1.18.2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
          distribution: temurin
      - name: Build and test Minecraft 1.18.2
        run: |
          chmod +x gradlew
          ./gradlew build -Pmc=1.18.2 --stacktrace --max-workers=2
      - name: Upload 1.18.2 test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-tests-1.18.2
          path: minecraft/minecraft-test-1.18.2/build/test-results/
          if-no-files-found: error
      - name: Upload 1.18.2 Loader
        uses: actions/upload-artifact@v4
        with:
          name: NeoFabric-jar-1.18.2
          path: build/minecraft-1.18.2/libs/neofabric-1.18.2-*.jar
          if-no-files-found: error

  regression-summary:
    if: always()
    needs: [build, integration, build-1.18.2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: NeoFabric-tests-*
          path: reports
      - name: Require passing reports for all nineteen versions
        run: python3 .github/scripts/summarize-tests.py reports
      - name: Require every build and integration job to pass
        env:
          CORE_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          LEGACY_RESULT: ${{ needs['build-1.18.2'].result }}
        run: test "$CORE_RESULT" = success && test "$INTEGRATION_RESULT" = success && test "$LEGACY_RESULT" = success
